# Deployment configuration.
# Consumed by the deploy scripts to resolve region, tags, and stack order.

region: ap-southeast-2
stackPrefix: sko26-grp13-cortexlab

# Project is tagged per-resource inside each template (driven by NamePrefix),
# so it's intentionally not repeated here.
tags:
  ManagedBy: cloudformation

# Stacks are deployed in listed order (foundational first).
# Each entry maps a stack name to its template and parameter file.
stacks:
  - name: cloudtrail
    template: templates/security/cloudtrail.yaml
    parameters: parameters/cloudtrail.json
  - name: vpc
    template: templates/network/vpc.yaml
    parameters: parameters/vpc.json
  - name: network-logging
    template: templates/network/logging.yaml
    parameters: parameters/logging.json
  - name: transfer-bucket
    template: templates/storage/s3.yaml
    parameters: parameters/s3.json
  - name: linux-vm
    template: templates/compute/linux-vm.yaml
    parameters: parameters/linux-vm.json
  - name: win-vm
    template: templates/compute/win-vm.yaml
    parameters: parameters/win-vm.json
  - name: eks
    template: templates/compute/eks.yaml
    parameters: parameters/eks.json
