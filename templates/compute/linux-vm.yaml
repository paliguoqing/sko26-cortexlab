AWSTemplateFormatVersion: "2010-09-09"
Description: >
  sko26-lab-linux-vm: an EC2 instance in the public subnet with outbound internet
  access. Reached via SSM Session Manager (no SSH keypair, no inbound rules).

Parameters:
  NamePrefix:
    Type: String
    Default: sko26-cortexlab
    Description: Prefix applied to all resource names in this stack.
  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type.
  KubectlMinorVersion:
    Type: String
    Default: "1.34"
    Description: >
      Kubernetes minor version stream for the kubectl binary installed on first
      boot. Keep this aligned with the eks stack's KubernetesVersion; the latest
      patch of this minor is resolved at launch.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: >
      Latest Ubuntu 24.04 LTS AMI, resolved from Canonical's public SSM
      parameter. Ubuntu is used (over AL2023) because cortexcli container image
      scans are supported on Ubuntu but not on AL2023. Canonical's cloud image
      ships the SSM Agent pre-installed (via snap); the AWS CLI and a container
      runtime are not, so first-boot UserData installs both.

Resources:
  # Role that lets the instance be managed by SSM Session Manager.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: transfer-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue: !Sub "${NamePrefix}-transfer-bucket-arn"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub
                  - "${BucketArn}/*"
                  - BucketArn:
                      Fn::ImportValue: !Sub "${NamePrefix}-transfer-bucket-arn"
        # Lets "aws eks update-kubeconfig" fetch the cluster endpoint/CA. The
        # in-cluster RBAC still comes from the EKS access entry (cluster-admin);
        # this only authorizes the DescribeCluster API call.
        - PolicyName: eks-describe-cluster
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${NamePrefix}-eks"
      Tags:
        - Key: Project
          Value: !Ref NamePrefix

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # No inbound rules — SSM needs none. Outbound open for internet access
  # (including the SSM control-channel endpoints).
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix}-linux-vm outbound-only (SSM managed, no inbound)"
      VpcId:
        Fn::ImportValue: !Sub "${NamePrefix}-vpc-id"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-linux-vm-sg"
        - Key: Project
          Value: !Ref NamePrefix

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub "${NamePrefix}-public-subnet-id"
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        # Ubuntu AMIs expose the root volume as /dev/sda1 (AL2023 used /dev/xvda).
        # This name must match the AMI's root device or the override won't apply.
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      # First-boot bootstrap: install the AWS CLI v2 and Docker (neither ships on
      # Ubuntu), then kubectl (matched to the cluster's minor version) and Helm
      # so this VM is ready as the kubectl host and as a cortexcli image-scan
      # host, then pull the pre-staged lab assets from the transfer bucket.
      # UserData only runs at launch, so changing it replaces the instance.
      # Output is logged to /var/log/cloud-init-output.log.
      UserData:
        Fn::Base64:
          !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              export AWS_DEFAULT_REGION="${Region}"
              export DEBIAN_FRONTEND=noninteractive
              ARCH=amd64

              # Base packages. curl/unzip drive the installers below; docker.io
              # gives cortexcli a local daemon to scan images against. The apt
              # lock timeout rides out cloud-init's early-boot apt-daily jobs so
              # this doesn't fail the whole bootstrap on a transient lock.
              apt-get -o DPkg::Lock::Timeout=600 update -y
              apt-get -o DPkg::Lock::Timeout=600 install -y \
                curl unzip ca-certificates docker.io
              systemctl enable --now docker

              # Let the interactive SSM user run docker without sudo. The
              # docker socket is root-owned but group-owned by "docker" (the
              # docker.io package creates that group), so group membership is
              # sufficient. The catch: ssm-user is created lazily on first SSM
              # session, which is too late for a boot-time usermod. So pre-create
              # ssm-user here and add it to the group before any session starts.
              # Pre-creating it also means the SSM Agent's own first-session setup
              # (which normally grants a freshly-created ssm-user NOPASSWD sudo)
              # never runs, so grant that explicitly ourselves instead of relying
              # on the agent. Also add the default "ubuntu" cloud user.
              # (There is no ec2-user on Ubuntu; that is an Amazon Linux account.)
              groupadd -f docker
              useradd -m -s /bin/bash ssm-user 2>/dev/null || true
              usermod -aG docker ssm-user
              usermod -aG docker ubuntu 2>/dev/null || true
              echo "ssm-user ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/90-ssm-user
              chmod 0440 /etc/sudoers.d/90-ssm-user

              # AWS CLI v2 (Ubuntu has no aws CLI preinstalled; installs to
              # /usr/local/bin/aws).
              curl -sSL --retry 5 \
                "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
                -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install
              ln -sf /usr/local/bin/aws /usr/bin/aws

              # kubectl: resolve the latest patch of the configured minor version.
              KVER="$(curl -sSL --retry 5 https://dl.k8s.io/release/stable-${KubectlMinorVersion}.txt)"
              curl -sSL --retry 5 -o /usr/local/bin/kubectl \
                "https://dl.k8s.io/release/${!KVER}/bin/linux/${!ARCH}/kubectl"
              chmod 0755 /usr/local/bin/kubectl

              # Helm via the official installer (detects arch, installs to /usr/local/bin).
              curl -fsSL --retry 5 https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o /tmp/get-helm-3
              chmod 0755 /tmp/get-helm-3
              /tmp/get-helm-3

              # Ensure both are on PATH for interactive SSM shells.
              ln -sf /usr/local/bin/kubectl /usr/bin/kubectl
              ln -sf /usr/local/bin/helm /usr/bin/helm

              # Pull the pre-staged lab assets (k8s manifest, deploy-app.sh,
              # config) that deploy-part1.sh uploaded to the transfer bucket, so
              # the class can run /opt/cortexlab/scripts/deploy-app.sh directly.
              # Non-fatal if nothing is staged yet.
              mkdir -p /opt/cortexlab
              # Record the transfer bucket name so on-VM scripts (e.g.
              # deploy-cortex.sh) can locate it without CloudFormation access.
              echo "${BucketName}" > /opt/cortexlab/transfer-bucket
              aws s3 cp --recursive "s3://${BucketName}/lab-assets/" /opt/cortexlab/ || true
              chmod -R a+rX /opt/cortexlab || true
              chmod +x /opt/cortexlab/scripts/*.sh 2>/dev/null || true
            - BucketName:
                Fn::ImportValue: !Sub "${NamePrefix}-transfer-bucket-name"
              Region: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-linux-vm"
        - Key: Project
          Value: !Ref NamePrefix

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref Instance
  ConnectCommand:
    Description: Open a shell on the instance via SSM Session Manager.
    Value: !Sub "aws ssm start-session --target ${Instance}"
  SecurityGroupId:
    Description: Instance security group ID (consumed by the EKS stack).
    Value: !Ref InstanceSecurityGroup
    Export:
      Name: !Sub "${NamePrefix}-linux-vm-sg-id"
  InstanceRoleArn:
    Description: Instance IAM role ARN (mapped into EKS as a cluster admin).
    Value: !GetAtt InstanceRole.Arn
    Export:
      Name: !Sub "${NamePrefix}-linux-vm-role-arn"
